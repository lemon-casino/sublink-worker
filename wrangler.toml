#:schema node_modules/wrangler/config-schema.json
name = "sublink-worker"
main = "src/worker.jsx"
compatibility_date = "2024-07-24"
compatibility_flags = ["nodejs_compat"]

kv_namespaces = [
  { binding = "SUBLINK_KV", id = "8943789ed0af49659f887fc740d11240" }
]

[assets]
directory = "./public"
binding = "ASSETS"

[[durable_objects.bindings]]
name = "SHORT_LINK_REVOCATIONS"
class_name = "ShortLinkRevocations"

[[migrations]]
tag = "v1-short-link-revocations"
new_sqlite_classes = ["ShortLinkRevocations"]

[[ratelimits]]
name = "READ_LIMITER"
namespace_id = "1001"
simple = { limit = 120, period = 60 }

[[ratelimits]]
name = "WRITE_LIMITER"
namespace_id = "1002"
simple = { limit = 10, period = 60 }

[vars]
SHORT_LINK_ORIGINS = "https://sub.lemon.vin,https://sublink-worker.lemon1024.workers.dev"
